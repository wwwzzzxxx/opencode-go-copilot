name: Publish Extension (Trusted Publishing)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Publish to Marketplace (Trusted Publishing)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "Publishing with PAT (trusted publishing not yet enrolled)"
            npx --yes @vscode/vsce@latest publish -p "$VSCE_PAT" --no-dependencies
          else
            echo "VSCE_PAT not set, trying Entra ID (trusted publishing)"
            npx --yes @vscode/vsce@latest publish --azure-credential --no-dependencies
          fi
