name: Publish Extension (Trusted Publishing)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Publish to Marketplace (Trusted Publishing)
        run: npx --yes @vscode/vsce@latest publish --azure-credential --no-dependencies
